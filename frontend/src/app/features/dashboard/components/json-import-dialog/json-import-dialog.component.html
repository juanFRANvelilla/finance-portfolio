@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 px-4 backdrop-blur-sm">
    <div class="w-full max-w-2xl rounded-2xl bg-slate-900 p-6 ring-1 ring-white/10 shadow-2xl">
      <div class="mb-4 flex items-start justify-between gap-4">
        <div>
          <h3 class="text-lg font-semibold text-white">Importar JSON del mes</h3>
          <p class="mt-1 text-sm text-slate-400">
            Se importará para <span class="font-medium text-slate-200">{{ monthNames[month() - 1] }} {{ year() }}</span>.
          </p>
        </div>
        <button
          type="button"
          (click)="onClose()"
          class="rounded-lg p-1 text-slate-400 transition hover:bg-slate-800 hover:text-white"
          aria-label="Cerrar"
        >
          ✕
        </button>
      </div>

      <div class="mb-3 flex flex-wrap items-center gap-3">
        <label class="inline-flex cursor-pointer items-center gap-2 rounded-xl bg-slate-800 px-3 py-2 text-sm text-slate-200 ring-1 ring-white/10 hover:bg-slate-700">
          <input type="file" accept="application/json,.json" class="hidden" (change)="onFileSelected($event)" />
          Seleccionar archivo .json
        </label>
        <button
          type="button"
          (click)="loadExample()"
          class="rounded-xl px-3 py-2 text-sm text-indigo-300 ring-1 ring-indigo-500/30 hover:bg-indigo-500/10"
        >
          Cargar ejemplo
        </button>
      </div>

      <textarea
        rows="14"
        [ngModel]="jsonText()"
        (ngModelChange)="jsonText.set($event)"
        placeholder='Pega aquí el JSON con simple_balances, hybrid_balances y expected_totals...'
        class="w-full rounded-xl border-none bg-slate-950/70 px-3 py-3 font-mono text-xs text-slate-100 outline-none ring-1 ring-white/10 focus:ring-2 focus:ring-indigo-500"
      ></textarea>

      @if (parseError()) {
        <p class="mt-3 text-sm text-rose-300">{{ parseError() }}</p>
      }
      @if (errorMessage()) {
        <p class="mt-3 text-sm text-rose-300">{{ errorMessage() }}</p>
      }

      <div class="mt-5 flex flex-wrap justify-end gap-3">
        <button
          type="button"
          (click)="onClose()"
          class="rounded-xl px-4 py-2.5 text-sm font-medium text-slate-300 hover:bg-slate-800"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="onImport()"
          [disabled]="importing() || !jsonText().trim()"
          class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-50"
        >
          @if (importing()) {
            <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4Z"></path>
            </svg>
          }
          Importar mes
        </button>
      </div>
    </div>
  </div>
}
