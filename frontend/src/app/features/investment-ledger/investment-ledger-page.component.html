<main class="mx-auto flex w-full max-w-6xl flex-col gap-4 overflow-x-hidden px-4 py-5 pb-16 sm:gap-6 sm:px-6 sm:py-8">
  @if (errorMessage()) {
    <div class="rounded-2xl bg-rose-500/10 px-4 py-3 text-sm text-rose-300 ring-1 ring-rose-500/20">
      {{ errorMessage() }}
    </div>
  }

  @if (importMessage()) {
    <div
      class="rounded-2xl px-4 py-3 text-sm ring-1"
      [class.bg-emerald-500/10]="!importFailed()"
      [class.text-emerald-200]="!importFailed()"
      [class.ring-emerald-500/20]="!importFailed()"
      [class.bg-rose-500/10]="importFailed()"
      [class.text-rose-300]="importFailed()"
      [class.ring-rose-500/20]="importFailed()"
    >
      {{ importMessage() }}
    </div>
  }

  @if (loading()) {
    <div class="flex items-center justify-center rounded-2xl bg-slate-800/40 py-24 text-slate-400">
      Cargando...
    </div>
  } @else {
    <app-investment-ledger
      [entities]="entities()"
      [year]="year()"
      [month]="month()"
      [importing]="importing()"
      (importCsv)="onImportCsv($event)"
    />
  }
</main>
