<div class="chart-wrap">
  <canvas #canvasRef></canvas>

  @if (centerLabel()) {
    <div class="chart-center">
      <span class="chart-center-label">{{ centerLabel() }}</span>
      <span class="chart-center-value">{{ centerValue() | eurCurrency }}</span>
    </div>
  }
</div>

<div class="chart-legend">
  @for (segment of segments(); track segment.id) {
    <button
      type="button"
      (click)="onLegendClick(segment.id)"
      class="chart-legend-item"
      [class.chart-legend-item--clickable]="clickable()"
      [class.chart-legend-item--static]="!clickable()"
      [disabled]="!clickable()"
    >
      <span class="chart-legend-dot" [style.background-color]="segment.color"></span>
      <span class="chart-legend-label">{{ segment.label }}</span>
      <span class="chart-legend-value">{{ segment.value | eurCurrency }}</span>
    </button>
  }
</div>
