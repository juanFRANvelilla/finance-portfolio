<div class="app-shell">
  <header class="app-header">
    <div class="app-header-inner">

      <div>
        <span class="app-brand-label">Finance Portfolio</span>
        <h1 class="app-brand-title">Panel de patrimonio personal</h1>
      </div>

      <app-month-navigator
        [year]="year()"
        [month]="month()"
        (monthChange)="onMonthChange($event)"
      />

      <div class="app-actions-row">
        <div class="app-view-switcher">
          <button
            type="button"
            id="nav-dashboard"
            class="app-nav-btn"
            [class.app-nav-btn--active-dashboard]="activeView() === 'dashboard'"
            (click)="navigateTo('dashboard')"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="app-nav-btn-icon">
              <path fill-rule="evenodd" d="M9.293 2.293a1 1 0 0 1 1.414 0l7 7A1 1 0 0 1 17 11h-1v6a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-6H3a1 1 0 0 1-.707-1.707l7-7Z" clip-rule="evenodd" />
            </svg>
            Vista general
          </button>
          <button
            type="button"
            id="nav-investment-detail"
            class="app-nav-btn"
            [class.app-nav-btn--active-investment]="activeView() === 'investment-detail'"
            (click)="navigateTo('investment-detail')"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="app-nav-btn-icon">
              <path d="M15.5 2A1.5 1.5 0 0 0 14 3.5v13a1.5 1.5 0 0 0 3 0v-13A1.5 1.5 0 0 0 15.5 2ZM9.5 6A1.5 1.5 0 0 0 8 7.5v9a1.5 1.5 0 0 0 3 0v-9A1.5 1.5 0 0 0 9.5 6ZM3.5 10A1.5 1.5 0 0 0 2 11.5v5a1.5 1.5 0 0 0 3 0v-5A1.5 1.5 0 0 0 3.5 10Z" />
            </svg>
            Detalle de inversión
          </button>
        </div>

        <button
          type="button"
          id="nav-investment-ledger"
          class="app-manage-tx-btn"
          [class.app-manage-tx-btn--active]="activeView() === 'investment-ledger'"
          (click)="navigateTo('investment-ledger')"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="app-nav-btn-icon">
            <path fill-rule="evenodd" d="M2 4.75A2.75 2.75 0 0 1 4.75 2h10.5A2.75 2.75 0 0 1 18 4.75v10.5A2.75 2.75 0 0 1 15.25 18H4.75A2.75 2.75 0 0 1 2 15.25V4.75Zm4 1.5a.75.75 0 0 0 0 1.5h8a.75.75 0 0 0 0-1.5H6Zm0 3.5a.75.75 0 0 0 0 1.5h8a.75.75 0 0 0 0-1.5H6Zm0 3.5a.75.75 0 0 0 0 1.5h4a.75.75 0 0 0 0-1.5H6Z" clip-rule="evenodd" />
          </svg>
          Gestionar transacciones
        </button>
      </div>

    </div>
  </header>

  <router-outlet />
</div>
