namespace: pro-finance-portfolio-front
replicaCount: 1
registry: ghcr.io/juanfranvelilla/finance-portfolio-frontend
image:
  tag: ""   # lo sobrescribe Jenkins al publicar el chart
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
extraEnv:
- name: "TZ"
  value: "UTC"
extraEnvFrom: []
resources:
  requests:
    memory: "64Mi"
    cpu: 100m
  limits:
    memory: "256Mi"
    cpu: 500m
volumes:
- name: tmpfs-var-lib-nginx-tmp
  emptyDir:
    medium: Memory
- name: tmpfs-run-nginx
  emptyDir:
    medium: Memory
volumeMounts:
- name: tmpfs-var-lib-nginx-tmp
  mountPath: /var/lib/nginx/tmp
- name: tmpfs-run-nginx
  mountPath: /run/nginx
ingress:
  enabled: false
gatewayRoute:
  enabled: true
  host: "pro.finance.juanfranciscoperez.es"
  path: "/"
gateway:
  enabled: true
  name: lab
  namespace: jenkins
  sectionName: https-finance-pro
  issuer: letsencrypt-ovh-prod
  tlsSecret: finance-pro-gateway-tls
