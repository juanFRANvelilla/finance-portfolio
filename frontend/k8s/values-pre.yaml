namespace: pre-finance-portfolio-front
replicaCount: 1
registry: ghcr.io/juanfranvelilla/finance-portfolio-frontend
image:
  tag: ""   # lo sobrescribe Jenkins con --set image.tag=<BUILD_NUMBER>
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
extraEnv:
- name: "TZ"
  value: "UTC"
extraEnvFrom: []
resources:
  requests:
    memory: "64Mi"
    cpu: 100m
  limits:
    memory: "256Mi"
    cpu: 500m
volumes:
- name: tmpfs-var-lib-nginx-tmp
  emptyDir:
    medium: Memory
- name: tmpfs-run-nginx
  emptyDir:
    medium: Memory
volumeMounts:
- name: tmpfs-var-lib-nginx-tmp
  mountPath: /var/lib/nginx/tmp
- name: tmpfs-run-nginx
  mountPath: /run/nginx
ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-set-header: X-Real-IP $remote_addr
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
  class: "nginx"
  # Mismo host que el backend: / al frontend, /api y /health al backend
  host: "finance.pre.local"
  tls: false
