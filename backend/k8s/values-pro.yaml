namespace: pro-finance-portfolio-back
# El scheduler de KuCoin corre dentro del proceso: con más de una réplica se duplicarían las sincronizaciones
replicaCount: 1
registry: ghcr.io/juanfranvelilla/finance-portfolio-backend
image:
  tag: ""   # lo sobrescribe Jenkins al publicar el chart
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
probes:
  path: /api/health
extraEnv:
- name: "TZ"
  value: "UTC"
- name: "CORS_ORIGINS"
  value: "http://finance.local"
# DATABASE_URL del secret debe apuntar a finance_portfolio_pro
extraEnvFrom:
- secretRef:
    name: backend-secrets
resources:
  requests:
    memory: "256Mi"
    cpu: 100m
  limits:
    memory: "512Mi"
    cpu: 500m
ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-set-header: X-Real-IP $remote_addr
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  class: "nginx"
  host: "finance.local"
  path: /api
  extraPaths:
    - /health
  tls: false
database:
  host: "postgres-service.postgres.svc.cluster.local"
