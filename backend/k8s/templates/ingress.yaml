{{- if .Values.ingress.enabled }}
{{- $hosts := list .Values.ingress.host }}
{{- range (.Values.ingress.extraHosts | default list) }}
{{- $hosts = append $hosts . }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.class }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
      {{- range $hosts }}
      - {{ . | quote }}
      {{- end }}
      secretName: {{ default (printf "%s-tls" .Release.Name) .Values.ingress.existingSecret }}
  {{- end }}
  rules:
  {{- range $hosts }}
  - host: {{ . }}
    http:
      paths:
      {{- range $.Values.ingress.extraPaths }}
      - path: {{ . | quote }}
        pathType: Prefix
        backend:
          service:
            name: {{ include "app.fullname" $ }}-service
            port:
              name: http
      {{- end }}
      - path: {{ $.Values.ingress.path | default "/" }}
        pathType: Prefix
        backend:
          service:
            name: {{ include "app.fullname" $ }}-service
            port:
              name: http
  {{- end }}
{{- end }}
